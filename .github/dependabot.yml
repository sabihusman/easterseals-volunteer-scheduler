version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Routine version-update PRs are silenced (0). Dependabot cannot
    # maintain bun.lock — this repo's frozen lockfile — so it only bumps
    # package.json, which then fails `bun install --frozen-lockfile`
    # (package-lock.json was removed in #205). Routine bumps are taken
    # MANUALLY instead (bump package.json → `bun install` → commit both;
    # see CONTRIBUTING.md). This does NOT affect Dependabot security
    # updates (separate internal limit) or vulnerability alerts — both
    # stay enabled at the repo level.
    open-pull-requests-limit: 0
    labels:
      - dependencies
    # Split-package majors Dependabot can't coordinate correctly — it
    # bumps one package per PR (or an incomplete group) and leaves
    # siblings on the older major, producing half-migrated states that
    # crash at install or test time. Majors on these packages are done
    # by hand in a single coordinated PR; patch + minor bumps still
    # flow through normally.
    #
    # Real incidents behind each entry:
    #   - PR #73: @eslint/js 9→10 alone → preserve-caught-error rule
    #     crashes ESLint 9 core at lint time (peerOptional didn't block
    #     install). Full ESLint 10 migration deferred.
    #   - PR #79: react + @types/react bumped to 19 but react-dom and
    #     @types/react-dom stayed at 18 → npm peer-dep conflict on
    #     install AND `ReactCurrentDispatcher undefined` crash in
    #     Vitest when react-dom 18 loads against react 19. React 19
    #     migration also needs app-level work (render API changes,
    #     Suspense semantics, etc.) — a Sprint-scheduled effort.
    #   - PRs #81/#86/#88: react-resizable-panels 2→4, react-day-picker
    #     8→9, and recharts 2→3 all merged auto-green because tsc wasn't
    #     running in CI at the time. Each broke the call-sites in
    #     shadcn-generated UI components (calendar.tsx, resizable.tsx,
    #     chart.tsx) via breaking API changes. Discovered + rolled back
    #     in PR #99 once tsc-in-CI started enforcing. Each needs its
    #     own migration PR.
    #   - PR #101: vite 5→8 alone → npm install fails with peer-dep
    #     conflict because @vitejs/plugin-react-swc@3 caps its vite peer
    #     at ^7. The plugin is what gives us React fast-refresh + JSX
    #     transform; both must move in lockstep. Vite 8 also generally
    #     comes with config schema and plugin-API tweaks that need
    #     hands-on migration. Closed; ignoring majors here until the
    #     plugin ecosystem catches up.
    ignore:
      # Catch-all: hold ALL major version bumps for manual review.
      # Added 2026-06 after a batch of unevaluated Dependabot MAJOR bumps
      # (zod 3→4, @hookform/resolvers 3→5, react-router-dom 6→7,
      # lucide-react 0→1, sonner 1→2, vaul 0→1) silently drifted the
      # lockfile and broke the test suite — reverted in PR #203, with a
      # prod hotfix in #204. Majors are now deliberate, validated manual
      # upgrades (remove this rule or open by hand when ready); patch +
      # minor still open normally. The per-package entries below predate
      # this wildcard and are now subsumed by it — kept for the incident
      # history their comments document.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # ESLint ecosystem
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react-hooks + typescript-eslint must move with
      # eslint core. PR #114 (this migration): react-hooks v7 is a
      # near-rewrite implementing React Compiler rules; typescript-eslint
      # majors track the eslint peer range. Bumped piecemeal they
      # produce half-migrated states or peer-dep install failures.
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]
      # React ecosystem — all four must move together
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # Shadcn-consumed UI libraries — each major bump requires hand-
      # migrating the generated UI components and is non-trivial
      - dependency-name: "recharts"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-day-picker"
        update-types: ["version-update:semver-major"]
      # date-fns is pinned by react-day-picker@8's peer dep
      # (^2.28.0 || ^3.0.0). PR #163: date-fns 3→4 alone fails
      # `npm install` with ERESOLVE on the day-picker peer (Vercel
      # build log: "peer date-fns ^2.28.0 || ^3.0.0 from
      # react-day-picker@8.10.1"). v4 has to wait for the
      # coordinated react-day-picker 8→9 migration above.
      - dependency-name: "date-fns"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-resizable-panels"
        update-types: ["version-update:semver-major"]
      # Vite + its React plugin must move together; @vitejs/plugin-react-swc
      # caps its vite peer at ^7 today, so vite 8 alone breaks `npm install`.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react-swc"
        update-types: ["version-update:semver-major"]
      # TypeScript major bumps are coordinated migrations — the type
      # checker, tsconfig schema, and downstream type packages all
      # need to move together. PR (closed): typescript 5→6 alone broke
      # CI after Vite-style peer/install issues surfaced.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Routine version-update PRs silenced (0) — Actions are bumped
    # deliberately. Security updates / alerts are unaffected.
    open-pull-requests-limit: 0
    labels:
      - dependencies
